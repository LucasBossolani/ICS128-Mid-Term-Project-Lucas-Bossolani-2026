<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Mid Term Lucas Bossolani</title>
    <link href="style.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
<div id="modal-div">
    <div class="modal fade" id="login-modal" tabindex="-1" aria-hidden="true" data-bs-backdrop="static">
        <div class="modal-dialog modal-dialog-centered">

            <div class="modal-content bg-dark text-white border border-3 border-danger">

                <div class="modal-header border-0 d-flex flex-column align-items-center position-relative pb-0">
                    <button id="btn-close" type="button" class="btn-close btn-close-white position-absolute top-0 end-0 m-3" data-bs-dismiss="modal" aria-label="Close"></button>

                    <h5 class="modal-title text-uppercase fw-bold text-warning fs-3">
                        Choose Your Fighter!
                    </h5>

                    <img class="Ryu-gif mt-2" src="Images/Ryu-gif.gif" alt="Ryugif">
                </div>

                <div class="modal-body p-4">
                    <label class="form-label text-white-50 small">Username</label>
                    <input class="form-control form-control-lg mb-3 bg-secondary text-white border-0 fw-bold" id="userName-input" type="text" placeholder="USERNAME"> <br>
                    <p id="errorMessage"></p>

                    <label class="form-label text-white-50 small">Uid</label>
                    <input class="form-control form-control-lg bg-secondary text-white border-0 fw-bold" id="UserId-input" type="text" placeholder="USER ID"> <br>
                    <p id="errorMessage2"></p>
                </div>

                <div class="modal-footer border-0 pt-0">
                    <button id="btn-login" type="button" class="btn btn-danger w-100 fw-bold py-2 fs-5 text-uppercase shadow-sm">
                        Fight!
                    </button>
                </div>

            </div>
        </div>
    </div>
</div>
<div class="container py-5">
    <div id="character-grid" class="sf2-grid-container">
    </div>
</div>



<script src="baseUsers.js"></script>
<script src="script.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
